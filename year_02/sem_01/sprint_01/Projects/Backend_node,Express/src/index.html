<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartLibrary — Library Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <span class="sidebar-logo-icon" id="sidebarLogoIcon"></span>
            <span class="sidebar-logo-text">SmartLibrary</span>
          </div>
          <button class="sidebar-close" id="sidebarClose" aria-label="Close menu"></button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Main navigation">
          <!-- Navigation items injected by JS -->
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-user" id="sidebarUser">
            <!-- User info injected by JS -->
          </div>
        </div>
      </aside>

      <!-- Sidebar backdrop (mobile) -->
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <!-- Main area -->
      <div class="main-area">
        <!-- Top Bar -->
        <header class="topbar">
          <button class="topbar-menu" id="menuToggle" aria-label="Toggle menu"></button>
          <div class="topbar-search">
            <span class="topbar-search-icon" id="searchIcon"></span>
            <input
              type="text"
              id="globalSearch"
              class="topbar-search-input"
              placeholder="Search books, authors, ISBN..."
              aria-label="Search books, authors, ISBN"
            />
          </div>
          <div class="topbar-actions">
            <button class="topbar-icon-btn" id="notifBtn" aria-label="Notifications">
              <span class="notif-icon" id="notifIcon"></span>
              <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
            </button>
            <div class="topbar-user" id="topbarUser">
              <!-- User dropdown injected by JS -->
            </div>
          </div>
        </header>

        <!-- Notification dropdown -->
        <div class="notif-dropdown" id="notifDropdown" style="display:none;">
          <div class="notif-dropdown-header">
            <span>Notifications</span>
            <button class="notif-mark-all" id="markAllRead">Mark all read</button>
          </div>
          <div class="notif-dropdown-body" id="notifDropdownBody">
            <!-- Notifications injected by JS -->
          </div>
        </div>

        <!-- Main content -->
        <main class="content" id="content">
          <!-- View content injected by JS -->
        </main>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
